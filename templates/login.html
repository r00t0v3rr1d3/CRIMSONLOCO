<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMSONLOCO</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
<script>try{var t=localStorage.getItem('CRIMSONLOCO-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
        }
        .login-container {
            background-color: #1e1e1e;
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,.3);
            text-align: center;
            width: 900px;
            max-width: 94vw;
            box-sizing: border-box;
            border: 1px solid #333;
            display: flex;
            overflow: hidden;
        }
        .login-logo { flex: 0 0 47%; background: #000; display: flex; align-items: center; }
        .login-logo img { width: 100%; display: block; }
        .login-form-side { flex: 1; padding: 40px 36px; display: flex; flex-direction: column; justify-content: center; }
        @media (max-width: 640px) {
            .login-container { flex-direction: column; width: 340px; }
            .login-logo { flex: none; }
            .login-form-side { padding: 24px 26px 30px; }
        }
        .login-container label {
            display: block; text-align: left; margin-top: 12px;
            font-size: 14px; color: #bbb;
        }
        .login-container input {
            width: 100%; padding: 10px; margin: 6px 0 4px;
            border: 1px solid #444; border-radius: 4px; box-sizing: border-box;
            background-color: #2c2c2c; color: #e0e0e0;
        }
        .login-container input:focus {
            outline: none; border-color: #f44336;
            box-shadow: 0 0 5px rgba(244,67,54,.5);
        }
        .login-container button {
            width: 100%; padding: 10px; background-color: #f44336; color: #fff;
            border: none; border-radius: 4px; cursor: pointer; font-size: 15px;
        }
        .login-container button:hover { background-color: #d32f2f; }
        .error {
            background-color: #3a1b1b; border: 1px solid #b71c1c;
            padding: 10px; border-radius: 4px; margin-bottom: 10px;
        }
        ::placeholder { color: #888; }
        html { color-scheme: dark; }
        html[data-theme="light"] { color-scheme: light; }
        html[data-theme="light"] body { background-color: #f2f2f3; color: #1d1d1f; }
        html[data-theme="light"] .login-container { background-color: #ffffff; border-color: #d9d9d9; box-shadow: 0 4px 6px rgba(0,0,0,.12); }
        html[data-theme="light"] .login-container label { color: #555; }
        html[data-theme="light"] .login-container input { background-color: #ffffff; color: #111; border-color: #bdbdbd; }
        html[data-theme="light"] .error { background-color: #fdecea; color: #1d1d1f; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo"><img src="/static/CRIMSONLOCO-logo.png" alt="CRIMSONLOCO, the red locomotive train"></div>
        <div class="login-form-side">
            {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
            <form action="/login/" method="POST">
                <input type="hidden" name="login_csrf" value="{{.LoginCSRF}}">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" name="username" autocomplete="username" required>
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                <button type="submit">Login</button>
            </form>
            <p style="color:#666;font-size:12px;margin-top:16px">v{{appVersion}}</p>
        </div>
    </div>
</body>
</html>
